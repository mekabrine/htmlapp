name: Verify HTMLApp iOS Compilation

on:
  workflow_dispatch:

concurrency:
  group: htmlapp-verify-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Unsigned iOS device build
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select latest available Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          CHOICE="$(printf '%s\n' /Applications/Xcode_26*.app | sort -Vr | head -n 1)"
          test -d "$CHOICE"
          sudo xcode-select -s "$CHOICE/Contents/Developer"
          xcodebuild -version
      - name: Ensure iOS device SDK
        run: |
          xcrun --sdk iphoneos --show-sdk-path || xcodebuild -downloadPlatform iOS
      - name: Test Forge prompt interpretation and edit preservation
        run: |
          swiftc HTMLAppV3/ForgeSemanticAppModel.swift HTMLAppV3/ForgeAppManifest.swift HTMLAppV3/ForgeCapabilityResolver.swift HTMLAppV3/ForgeEditSafetyGate.swift HTMLAppV3/ForgeFocusedEditContext.swift scripts/test-forge-contract.swift -o "$RUNNER_TEMP/htmlapp-forge-contract-test"
          "$RUNNER_TEMP/htmlapp-forge-contract-test"
      - name: Test edit acceptance and API catalog
        run: |
          swiftc HTMLAppV3/ForgeEditAcceptance.swift scripts/test-edit-acceptance.swift -o "$RUNNER_TEMP/htmlapp-edit-acceptance"
          "$RUNNER_TEMP/htmlapp-edit-acceptance"
          swiftc HTMLAppV3/HTMLAppDocumentMode.swift scripts/test-document-mode.swift -o "$RUNNER_TEMP/htmlapp-document-mode"
          "$RUNNER_TEMP/htmlapp-document-mode"
          python3 scripts/check-api-catalog.py --offline
          python3 scripts/test-api-catalog.py
      - name: Test provider completion and atomic patch application
        run: python3 scripts/test-generation-reliability.py
      - name: Test public-address safety rules on macOS
        run: |
          swiftc HTMLAppV3/HTMLAppPublicAddressGuard.swift scripts/test-public-address-guard.swift -o /tmp/htmlapp-address-guard-test
          /tmp/htmlapp-address-guard-test
      - name: Test SQLite document full-text index on macOS
        run: |
          swiftc HTMLAppV3/HTMLAppDocumentDatabase.swift scripts/test-sqlite-fts.swift -o /tmp/htmlapp-fts-test
          /tmp/htmlapp-fts-test
      - name: Test on-device vector-search contracts on macOS
        run: |
          swiftc HTMLAppV3/HTMLAppDocumentDatabase.swift HTMLAppV3/HTMLAppVectorSearch.swift scripts/test-vector-search.swift -o /tmp/htmlapp-vector-test
          /tmp/htmlapp-vector-test
      - name: Exercise ZIP Store, Deflate and integrity regressions
        run: |
          python3 scripts/create-zip-fixtures.py "$RUNNER_TEMP/htmlapp-zip-tests"
          swiftc HTMLAppV3/HTMLAppStoredZip.swift scripts/test-stored-zip.swift -o "$RUNNER_TEMP/htmlapp-zip-tests-bin"
          "$RUNNER_TEMP/htmlapp-zip-tests-bin" "$RUNNER_TEMP/htmlapp-zip-tests"
      - name: Test offline great-circle location distances
        run: |
          swiftc HTMLAppV3/HTMLAppAddressLookup.swift scripts/test-location-distance.swift -o "$RUNNER_TEMP/htmlapp-distance-test"
          "$RUNNER_TEMP/htmlapp-distance-test"
      - name: Install XcodeGen and generate project
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew list xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate
      - name: Compile app and embedded widgets (no signing)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project HTMLApp.xcodeproj \
            -scheme HTMLApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$PWD/DerivedDataVerify" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee ios-build.log
          test -d DerivedDataVerify/Build/Products/Debug-iphoneos/HTMLApp.app
      - name: Upload build log if compilation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-compile-log
          path: ios-build.log
          if-no-files-found: warn

